name: Keep Streamlit App Alive

on:
  schedule:
    # 4時間おきに実行（1日6回アクセスしてスリープを防ぐ）
    - cron: '0 */4 * * *'
  # 手動でいつでも実行できるようにする設定
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Access Streamlit App
        # ブラウザのふり（User-Agent）をしてアクセスし、リダイレクトループ(Error 47)を回避します
        run: |
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "https://ancient-fish-aquarium-zz3ypf2c3dvibohusziftv.streamlit.app/" > /dev/null
